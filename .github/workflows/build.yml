name: Build KPM

on:
  push:
    branches: [ main ]
    paths:
      - 'hello.c'
      - 'kpm-hide.c'
      - 'hosts_file_redirect.c'
      - 'include/**'
      - 'Makefile'
      - 'hello.lds'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  create:
    tags:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone KernelPatch source (SukiSU fork)
        run: git clone --depth=1 https://github.com/ShirkNeko/SukiSU_KernelPatch_patch KernelPatch

      - name: Setup Android NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_PATH=$HOME/android-ndk-r27c" >> "$GITHUB_ENV"
          "$HOME/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" --version | head -1

      - name: Build KPM
        env:
          KP_DIR: ${{ github.workspace }}/KernelPatch
        run: |
          make clean || true
          make V=1

      - name: Show output
        run: ls -la *.kpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpm-modules
          path: "*.kpm"
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hello.kpm
